window.runMovie=async function(record=false){document.querySelector('button').style.display='none';const ac=new AudioContext();await ac.resume();const dest=ac.createMediaStreamDestination();const tracks=[];let offset=0;for(let i=0;i<7;i++){const response=await fetch('voice-'+i+'.wav');const audio=await ac.decodeAudioData(await response.arrayBuffer());tracks.push({audio,start:offset,duration:audio.duration+.8});offset+=audio.duration+.8}const total=offset+.2;let rec,chunks=[];if(record){const stream=canvas.captureStream(24);stream.addTrack(dest.stream.getAudioTracks()[0]);const mp4='video/mp4;codecs=avc1.42001E,mp4a.40.2';const mime=MediaRecorder.isTypeSupported(mp4)?mp4:'video/webm;codecs=vp8,opus';window.outputExtension=mime.startsWith('video/mp4')?'mp4':'webm';rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:3500000,audioBitsPerSecond:128000});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.start(1000)}const start=ac.currentTime+.15;for(const t of tracks){const src=ac.createBufferSource();src.buffer=t.audio;src.connect(dest);src.connect(ac.destination);src.start(start+t.start+.25)}await new Promise(resolve=>{function tick(){const t=Math.max(0,ac.currentTime-start);let ix=tracks.findIndex((v,i)=>t<v.start+v.duration);if(ix<0)ix=6;frame(ix,Math.min(1,Math.max(0,(t-tracks[ix].start)/tracks[ix].duration)));if(t<total)requestAnimationFrame(tick);else resolve()}tick()});if(rec){await new Promise(resolve=>{rec.onstop=resolve;rec.stop()});const blob=new Blob(chunks,{type:rec.mimeType});const bytes=new Uint8Array(await blob.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));window.videoBase64=btoa(binary)}await ac.close();return {duration:total,extension:window.outputExtension,bytes:chunks.reduce((n,v)=>n+v.size,0)}};
document.querySelector('button').onclick=()=>runMovie(false);
